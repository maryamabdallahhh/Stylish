name: stylish
description: "Stylish — Flutter e-commerce app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  go_router: ^14.8.1

  get_it: ^8.0.3

  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  dartz: ^0.10.1

  flutter_screenutil: ^5.9.3

  google_fonts: ^6.2.1

  intl: ^0.20.2

  flutter_native_splash: ^2.4.4

  shared_preferences: ^2.3.4

  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.8

  # ── SVG rendering ──────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
