name: stylish
description: "Stylish — Flutter e-commerce app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Dependency injection ──────────────────────────────────────────────────
  get_it: ^8.0.3

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── Functional programming ────────────────────────────────────────────────
  dartz: ^0.10.1

  # ── Responsive UI ─────────────────────────────────────────────────────────
  flutter_screenutil: ^5.9.3

  # ── Fonts ─────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Local storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.3.4

  # ── Images ────────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1

  # ── Icons ─────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
